<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="#4f46e5"/>
  <rect width="512" height="512" rx="128" fill="url(#grad)" />

  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Minimalist Bold Quote Glyph -->
  <g fill="#ffffff" transform="translate(116, 120)">
    <!-- First Quote Mark -->
    <path d="M 30 140 C 30 60, 80 20, 130 10 L 140 50 C 105 60, 75 85, 75 120 L 130 120 C 145 120, 155 132, 155 148 L 155 230 C 155 248, 140 260, 120 260 L 65 260 C 45 260, 30 245, 30 225 Z" />
    
    <!-- Second Quote Mark with Amber Spark -->
    <path d="M 165 140 C 165 60, 215 20, 265 10 L 275 50 C 240 60, 210 85, 210 120 L 265 120 C 280 120, 290 132, 290 148 L 290 230 C 290 248, 275 260, 255 260 L 200 260 C 180 260, 165 245, 165 225 Z" />
  </g>

  <!-- Accent Sparkle Dot -->
  <circle cx="380" cy="130" r="28" fill="url(#amber)" />
  <path d="M 380 85 L 380 175 M 335 130 L 425 130" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
</svg>
